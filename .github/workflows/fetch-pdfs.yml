name: Fetch NTS PDFs
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fetch-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current 2024 execution-standard PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pdfs

          fetch_book() {
            bsc="$1"
            book="$2"
            out="$3"
            param=$(printf '{"ntstBscId":"%s","ntstPlcnBkId":"%s"}' "$bsc" "$book")

            curl -fsSL --retry 3 \
              -H 'User-Agent: Mozilla/5.0' \
              -H 'X-Requested-With: XMLHttpRequest' \
              -H 'Referer: https://taxlaw.nts.go.kr/st/USESTE002M.do' \
              --data-urlencode 'actionId=ASISTE001MR03' \
              --data-urlencode "paramData=$param" \
              'https://taxlaw.nts.go.kr/action.do' > /tmp/years.json

            ids=$(python3 -c "import json; j=json.load(open('/tmp/years.json')); rows=j['data']['ASISTE001MR03']['exeBaseDVOList']; r=next(x for x in rows if str(x.get('rgtYr'))=='2024'); print(r['fleId'], r['fleSn'])")
            set -- $ids
            fleId="$1"
            fleSn="$2"

            echo "Downloading $out from fleId=$fleId fleSn=$fleSn"
            curl -fsSL --retry 3 \
              -H 'User-Agent: Mozilla/5.0' \
              "https://taxlaw.nts.go.kr/downloadPDFFile.do?fleId=$fleId&fleSn=$fleSn" \
              -o "pdfs/$out"

            python3 -c "import pathlib,sys; p=pathlib.Path('pdfs')/sys.argv[1]; h=p.read_bytes()[:5]; assert h==b'%PDF-', (p,h); print(p,p.stat().st_size)" "$out"
          }

          fetch_book '200000000000001565' '511100000000000006' 'yangdo.pdf'
          fetch_book '100000000000001561' '511100000000000008' 'sangjeung.pdf'

      - name: Commit PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdfs/yangdo.pdf pdfs/sangjeung.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged"
            exit 0
          fi
          git commit -m "Add original NTS execution-standard PDFs"
          git push
