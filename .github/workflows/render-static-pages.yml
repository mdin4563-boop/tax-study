name: Render static PDF pages
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/render-static-pages.yml"
      - "pdfs/yangdo.pdf"
      - "pdfs/sangjeung.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render PDF pages once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages _render
          mkdir -p pages _render/y _render/s
          pdftoppm -f 25 -l 155 -r 150 -jpeg -jpegopt quality=86 pdfs/yangdo.pdf _render/y/page
          pdftoppm -f 23 -l 207 -r 150 -jpeg -jpegopt quality=86 pdfs/sangjeung.pdf _render/s/page

          python3 -c "from pathlib import Path; import re,shutil; files=sorted(Path('_render/y').glob('page-*.jpg'),key=lambda p:int(re.search(r'(\\d+)$',p.stem).group(1))); assert len(files)==131,len(files); [shutil.move(str(p),Path('pages')/f'yangdo-{i:03d}.jpg') for i,p in enumerate(files,1)]"
          python3 -c "from pathlib import Path; import re,shutil; files=sorted(Path('_render/s').glob('page-*.jpg'),key=lambda p:int(re.search(r'(\\d+)$',p.stem).group(1))); assert len(files)==185,len(files); [shutil.move(str(p),Path('pages')/f'sangjeung-{i:03d}.jpg') for i,p in enumerate(files,1)]"

          test "$(find pages -name '*.jpg' | wc -l)" -eq 316
          du -sh pages
          rm -rf _render

      - name: Commit static pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages
          if git diff --cached --quiet; then
            echo "Static pages unchanged"
            exit 0
          fi
          git commit -m "Add static PDF page images"
          git push
