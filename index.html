<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한 장씩 집행기준</title>
<style>
:root{--bg:#f4f5f6;--paper:#fff;--ink:#181a1d;--sub:#70757c;--line:#e3e5e7;--accent:#d85b48;--dark:#26292d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:30px 16px 70px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:16px}
.eyebrow{font-size:13px;color:var(--sub);letter-spacing:.06em}
h1{font-size:27px;line-height:1.2;margin:4px 0 0}
.progress{text-align:right;color:var(--sub);font-size:13px}
.progress b{display:block;color:var(--ink);font-size:19px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.035)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.tax{font-weight:800;font-size:17px}
.pg{font-weight:800;color:var(--accent)}
.viewer{padding:18px;background:#e9eaec}
.sheet{max-width:820px;margin:0 auto 18px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden}
.sheet:last-child{margin-bottom:0}
.sheet img{display:block;width:100%;height:auto}
.continue{font-size:12px;font-weight:800;color:var(--accent);padding:10px 13px;background:#fff4f1;border-bottom:1px solid #f2d5ce}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{border-radius:12px;padding:14px 18px;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer;text-align:center}
.source{background:#fff;color:var(--ink);border:1px solid var(--line)}
.prev{background:#fff;color:var(--ink);border:1px solid var(--line)}
.prev:disabled{opacity:.38;cursor:default}
.next{border:0;background:var(--dark);color:#fff;flex:1}
.note{display:flex;justify-content:space-between;gap:15px;margin-top:12px;color:var(--sub);font-size:12px}
.reset{font:inherit;border:0;background:none;color:var(--sub);text-decoration:underline;cursor:pointer;padding:0}
.done{text-align:center;padding:65px 28px}
.done h2{font-size:26px;margin:0 0 8px}
.done p{color:var(--sub)}
@media(max-width:600px){
 .wrap{padding:20px 10px 50px}
 .top{align-items:flex-start}
 h1{font-size:23px}
 .cardhead{padding:15px 16px}
 .viewer{padding:8px}
 .sheet{margin-bottom:9px}
 .actions{flex-direction:column}
 .source{order:2}
 .note{display:block}
 .note span{display:block;margin-bottom:5px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">개인 공부용 · 2024년 9월 기준</div>
      <h1>한 장씩 집행기준</h1>
    </div>
    <div class="progress" id="prog"></div>
  </div>
  <div id="app"></div>
</div>
<script>
const ALL=[];
for(let p=1;p<=131;p++) ALL.push({tax:'yangdo',label:'양도소득세',page:p,img:'pages/yangdo-',pdf:'pdfs/yangdo.pdf',physical:p+24});
for(let p=1;p<=185;p++) ALL.push({tax:'sangjeung',label:'상속·증여세',page:p,img:'pages/sangjeung-',pdf:'pdfs/sangjeung.pdf',physical:p+22});

const KEY='taxStudyUnified316_v3';
const LAST_PAGE={yangdo:131,sangjeung:185};
// Every study item shows its own page plus the adjacent page. At a document's end, use the previous page.
function displayPages(p){return p.page<LAST_PAGE[p.tax]?[p.page,p.page+1]:[p.page-1,p.page]}
function pad(n){return String(n).padStart(3,'0')}
function imgUrl(p,n){return p.img+pad(n)+'.jpg'}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return {order:shuffle(ALL.map((_,i)=>i)),pos:0,started:new Date().toISOString()}}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!Array.isArray(state.order)||state.order.length!==ALL.length) state=fresh();
if(!Number.isInteger(state.viewPos)) state.viewPos=state.pos;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function preload(){
  const nextPos=state.viewPos+1;
  if(nextPos>=ALL.length)return;
  const p=ALL[state.order[nextPos]];
  displayPages(p).map(n=>imgUrl(p,n)).forEach(src=>{const im=new Image();im.src=src});
}
function render(){
  const app=document.getElementById('app'), prog=document.getElementById('prog');
  if(state.viewPos>=ALL.length){
    prog.innerHTML='<b>316 / 316</b>통합 랜덤 1회독';
    app.innerHTML='<div class="card done"><h2>1회독 완료</h2><p>양도소득세 + 상속·증여세 집행기준 316쪽을 모두 봤습니다.</p><div class="actions"><button class="btn prev" onclick="prevItem()">← 이전</button><button class="btn next" onclick="resetAll()">다시 섞어서 2회독 시작</button></div></div>';
    return;
  }
  const p=ALL[state.order[state.viewPos]];
  prog.innerHTML='<b>'+(state.viewPos+1)+' / '+ALL.length+'</b>'+(state.viewPos<state.pos?'이전 항목 보는 중':'통합 랜덤 1회독');
  const pages=displayPages(p);
  const sheets=pages.map((page,i)=>
    '<div class="sheet">'+
      (i===1?'<div class="continue">'+(page===p.page?'이번 학습 페이지':'함께 보는 다음 페이지')+' · '+page+'쪽</div>':'')+
      '<img src="'+imgUrl(p,page)+'" alt="'+p.label+' '+page+'쪽">'+
    '</div>'
  ).join('');
  app.innerHTML=
    '<section class="card">'+
      '<div class="cardhead"><div class="tax">'+p.label+' 집행기준</div><div class="pg">'+pages[0]+'–'+pages[1]+'쪽'+'</div></div>'+
      '<div class="viewer">'+sheets+'</div>'+
    '</section>'+
    '<div class="actions"><a class="btn source" href="'+p.pdf+'#page='+p.physical+'" target="_blank" rel="noopener">원본 PDF 보기</a><button class="btn prev" onclick="prevItem()" '+(state.viewPos===0?'disabled':'')+'>← 이전</button><button class="btn next" onclick="doneNext()">'+(state.viewPos<state.pos?'다음 →':'읽었음 · 다음')+'</button></div>'+
    '<div class="note"><span>PDF 원본 페이지를 미리 렌더링한 정적 화면입니다. 읽은 항목만 진행됩니다.</span><button class="reset" onclick="resetAll()">진행상황 초기화</button></div>';
  preload();
}
function prevItem(){if(state.viewPos>0){state.viewPos--;save();render();window.scrollTo(0,0)}}
function doneNext(){if(state.viewPos<state.pos){state.viewPos++;}else{state.pos=Math.min(state.pos+1,ALL.length);state.viewPos=state.pos;}save();render();window.scrollTo(0,0)}
function resetAll(){if(confirm('진행상황을 지우고 316쪽을 다시 섞을까요?')){state=fresh();state.viewPos=0;save();render();window.scrollTo(0,0)}}
save();render();
</script>
</body>
</html>
